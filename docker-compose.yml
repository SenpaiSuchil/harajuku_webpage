version: '3.8'

services:
  web:
    build: .
    container_name: harajuku_app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Opcional: si usas SECRET_KEY para sesiones, define aquí
      # SECRET_KEY: cambia-esto-por-algo-largo-y-aleatorio
      FLASK_ENV: production
    restart: unless-stopped